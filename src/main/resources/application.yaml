

# 服务器配置

server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true

# Spring配置
spring:
  url: 127.0.0.1
  application:
    name: fish-seedling-platform
  data:
    mongodb:
      host: localhost           # MongoDB 服务器地址
      port: 27017               # 端口号
      database: test     # 数据库名称
      authentication-database: admin  # 认证数据库（无认证时可不写）
  # 数据源配置
  datasource:
    dynamic:
      primary: mysql           # 默认数据源（MyBatis-Plus 默认用这个）
      strict: false           # false: 没找到数据源时用默认的，不抛异常
      datasource:
        mysql: # MyBatis 使用这个数据源
          type: com.alibaba.druid.pool.DruidDataSource
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:3306/fish_seedling_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: root
          password: root
          druid:
            initial-size: 5
            min-idle: 5
            max-active: 20
            max-wait: 60000
            time-between-eviction-runs-millis: 60000
            min-evictable-idle-time-millis: 300000
            validation-query: SELECT 1
            test-while-idle: true
            test-on-borrow: false
            test-on-return: false

        postgresql: # PostgreSQL 数据源（其他地方使用）
          type: com.alibaba.druid.pool.DruidDataSource
          driver-class-name: org.postgresql.Driver
          url: jdbc:postgresql://localhost:5432/fish_seedling_platform
          username: postgres
          password: root
          druid:
            initial-size: 5
            min-idle: 5
            max-active: 20
            max-wait: 60000
            time-between-eviction-runs-millis: 60000
            min-evictable-idle-time-millis: 300000
            validation-query: SELECT 1
            test-while-idle: true
            test-on-borrow: false
            test-on-return: false





  # Redis配置
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

# MyBatis Plus配置
mybatis-plus:
  # Mapper XML文件位置
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类包路径
  type-aliases-package: com.fishseedling.platform.entity
  # 全局配置
  global-config:
    db-config:
      # 主键类型
      id-type: AUTO
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  # 配置
  configuration:
    # 驼峰命名转换
    map-underscore-to-camel-case: true
    # 日志输出
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 缓存
    cache-enabled: true

# 日志配置
logging:
  level:
    root: ERROR
    com.fishseedling.platform: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
  file:
    name: logs/fish-seedling-platform.log
    max-size: 10MB
    max-history: 30



# 自定义配置
app:
  # JWT配置
  jwt:
    secret: fishSeedlingPlatformSecretKey2023
    expiration: 7200000 # 2小时，单位毫秒

  # 文件上传配置
  upload:
    # 上传路径（使用用户主目录下的绝对路径）
    path: ${user.home}/uploads/fish-seedling-platform/
    # 访问URL前缀
    url-prefix: /api/files/

  # 限流配置
  rate-limit:
    # IP每小时发布限制
    ip-hour-limit: 3
    # 设备每天发布限制
    device-day-limit: 10



canal:
  # Canal Server 地址
  host: 127.0.0.1
  port: 11111
  # 实例名称
  destination: example

milvus:
  host: localhost
  port: 19530
  dimension: 1024
  username: root
  password: Milvus

llm:
  base-url: https://api.deepseek.com
  api-key: sk-your-key
  model-name: deepseek-chat
  log-requests: true
  log-responses: true



scoring:
  api-key: sk-your-key
  model-name: qwen3-rerank
  top-n: 5
  timeout-seconds: 30

embedding:
  base-url: http://localhost:11434
  model-name: qwen3-embedding:0.6b
  settings:
    retrievers:
      help-content:
        max-results: 2
        min-score: 0.3
      api:
        max-results: 2
        min-score: 0.3
      handbook:
        max-results: 2
        min-score: 0.3

websearch:
  api-key: sk-your-key  # 可选，如果没有则从 .env 读取
  engine-type: LiteAdvanced  # 可选值: LiteAdvanced, Standard 等
  max-results: 5

save-records:
  user-records: 10
  admin-record: 20







